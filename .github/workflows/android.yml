name: Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare optional release signing
        shell: bash
        env:
          CLICKPLUS_KEYSTORE_BASE64: ${{ secrets.CLICKPLUS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CLICKPLUS_KEYSTORE_BASE64" ]; then
            echo "$CLICKPLUS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/clickplus-release.jks"
            echo "CLICKPLUS_KEYSTORE_PATH=$RUNNER_TEMP/clickplus-release.jks" >> "$GITHUB_ENV"
          else
            echo "No release keystore secret configured; build will use the installable debug signing key."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK
        env:
          CLICKPLUS_KEYSTORE_PASSWORD: ${{ secrets.CLICKPLUS_KEYSTORE_PASSWORD }}
          CLICKPLUS_KEY_ALIAS: ${{ secrets.CLICKPLUS_KEY_ALIAS }}
          CLICKPLUS_KEY_PASSWORD: ${{ secrets.CLICKPLUS_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClickPlus-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
